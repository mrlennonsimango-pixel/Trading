<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trading Platform</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <strong>Trading Platform</strong>
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">Connecting...</span>
    </div>
  </header>

  <main class="app">
    <section class="toolbar">
      <div class="control">
        <label for="market">Market</label>
        <select id="market"></select>
      </div>

      <div class="control">
        <label for="timeframe">Timeframe</label>
        <select id="timeframe"></select>
      </div>

      <button id="loadButton">Load Market Data</button>
      <button id="loadOlderButton" class="secondary-button">Load Older History</button>
    </section>

    <section class="market-info">
      <div>
        <span class="label">Selected market</span>
        <strong id="selectedMarket">—</strong>
      </div>
      <div>
        <span class="label">Timeframe</span>
        <strong id="selectedTimeframe">—</strong>
      </div>
      <div>
        <span class="label">Candles</span>
        <strong id="candleCount">—</strong>
      </div>
    </section>

    <section class="backtest-panel">
      <div class="panel-header">
        <strong>Backtest</strong>
        <span id="backtestStatus">Uses candles stored in D1.</span>
      </div>
      <div class="backtest-controls">
        <label>Fast MA <input id="fastLength" type="number" value="20" min="2"></label>
        <label>Slow MA <input id="slowLength" type="number" value="50" min="3"></label>
        <label>RSI <input id="rsiLength" type="number" value="14" min="2"></label>
        <label>RR <input id="rr" type="number" value="3" min="0.1" step="0.1"></label>
        <button id="backtestButton">Run Backtest</button>
      </div>
      <div class="backtest-results">
        <div><span class="label">Trades</span><strong id="btTrades">—</strong></div>
        <div><span class="label">Win rate</span><strong id="btWinRate">—</strong></div>
        <div><span class="label">Net P/L</span><strong id="btPnl">—</strong></div>
        <div><span class="label">Final equity</span><strong id="btEquity">—</strong></div>
      </div>
    </section>

    <section class="chart-panel">
      <div class="panel-header">
        <strong id="chartTitle">Market Chart</strong>
        <span id="dataStatus">Select a market and timeframe.</span>
      </div>
      <div id="chartArea" class="chart-area"></div>
    </section>
  </main>

  <script src="https://unpkg.com/lightweight-charts@5.0.0/dist/lightweight-charts.standalone.production.js"></script>
  <script src="/app.js"></script>
</body>
</html>
