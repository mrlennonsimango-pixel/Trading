<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trading Platform</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <strong>Trading Platform</strong>
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">Connecting...</span>
    </div>
  </header>

  <main class="app">
    <section class="toolbar">
      <div class="control">
        <label for="market">Market</label>
        <select id="market"></select>
      </div>

      <div class="control">
        <label for="timeframe">Timeframe</label>
        <select id="timeframe"></select>
      </div>

      <button id="loadButton">Load Market Data</button>
    </section>

    <section class="market-info">
      <div>
        <span class="label">Selected market</span>
        <strong id="selectedMarket">—</strong>
      </div>
      <div>
        <span class="label">Timeframe</span>
        <strong id="selectedTimeframe">—</strong>
      </div>
      <div>
        <span class="label">Candles</span>
        <strong id="candleCount">—</strong>
      </div>
    </section>

    <section class="chart-panel">
      <div class="panel-header">
        <strong id="chartTitle">Market Chart</strong>
        <span id="dataStatus">Select a market and timeframe.</span>
      </div>
      <div id="chartArea" class="chart-area"></div>
    </section>
  </main>

  <script src="https://unpkg.com/lightweight-charts@5.0.0/dist/lightweight-charts.standalone.production.js"></script>
  <script src="/app.js"></script>
</body>
</html>
